name: back-ci
on:
  pull_request:
    paths: ["api/**"]
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: noyer
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/noyer
      DJANGO_SECRET_KEY: ci-uniquement
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libmariadb-dev pkg-config
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py test
