name: Chef d'orchestre
# Toutes les 30 minutes : fusionne les PR vertes, fait réparer les PR en échec,
# et lance le ticket front et le ticket back suivants.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # Réagit aussi dès qu'une vérification ou un agent a fini : pas besoin d'attendre le tour suivant.
  workflow_run:
    workflows: ["front-ci", "back-ci", "Claude Dev", "Agent testeur", "Claude Code Review", "QA visuel", "Gardien du contrat d'API", "Revue de sécurité", "Intégration front + back"]
    types: [completed]

concurrency:
  group: orchestrateur
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read
  issues: write
  actions: read

jobs:
  orchestrer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/orchestrateur
      - name: Orchestrer
        env:
          GH_TOKEN: ${{ secrets.NOYER_BOT_TOKEN }}
          LECTURE_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIMITE_JOUR: "1000" # pas de limite : enchaîne tant qu'il y a des tickets
        # Une CI relancée ne réveille pas le chef d'orchestre : il attend lui-même la fin et repasse.
        run: |
          for tour in 1 2 3; do
            bash .github/orchestrateur/orchestrer.sh | tee sortie.txt
            grep -q "🔁" sortie.txt || break
            echo "--- attente de la CI relancée ---"
            sleep 240
          done
