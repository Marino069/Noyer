name: Claude Front
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude'
        && contains(github.event.issue.labels.*.name, 'frontend')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),mcp__github__create_pull_request"
            --append-system-prompt "Travaille uniquement dans front/ et docs/. Respecte CLAUDE.md. Quand lint, typecheck et build passent, ouvre toi-même la pull request vers master avec l'outil create_pull_request : titre '[<id du ticket>] <titre>', description qui commence par 'Closes #<numéro de l'issue>' puis résume ce qui est fait et ce qui reste. Si une action t'est refusée, explique-le dans la description de la PR."
