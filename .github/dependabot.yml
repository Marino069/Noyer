version: 2
updates:
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependances-front:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependances-back:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
